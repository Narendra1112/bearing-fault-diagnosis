name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ── Job 1: Unit + integration tests ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run unit tests (no data/model required)
        run: |
          pytest tests/unit/ -v --tb=short

      # Integration tests need the model + processed data.
      # In CI these are pulled from the HF model repo (or skipped if absent).
      - name: Download model and data artifacts
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          try:
              from huggingface_hub import hf_hub_download
              os.makedirs("models", exist_ok=True)
              os.makedirs("data/processed", exist_ok=True)
              for fn, dest in [
                  ("best_cnn.pth", "models"),
                  ("train.npz", "data/processed"),
                  ("test.npz", "data/processed"),
              ]:
                  try:
                      hf_hub_download(
                          repo_id="Narendra1112/bearing-fault-cnn",
                          repo_type="model", filename=fn, local_dir=dest,
                      )
                      print(f"Downloaded {fn}")
                  except Exception as e:
                      print(f"Skip {fn}: {e}")
          except ImportError:
              print("huggingface_hub not available — skipping artifact download")
          PY
        continue-on-error: true

      - name: Run integration tests
        run: |
          if [ -f models/best_cnn.pth ] && [ -f data/processed/test.npz ]; then
            pytest tests/integration/ -v --tb=short
          else
            echo "Model/data artifacts not available — skipping integration tests"
          fi

  # ── Job 2: Model validation gate (main only) ────────────────────────────────
  validate-model:
    name: Validate Model
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download model and test data
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          os.makedirs("models", exist_ok=True)
          os.makedirs("data/processed", exist_ok=True)
          for fn, dest in [("best_cnn.pth", "models"), ("test.npz", "data/processed")]:
              hf_hub_download(
                  repo_id="Narendra1112/bearing-fault-cnn",
                  repo_type="model", filename=fn, local_dir=dest,
              )
          PY

      - name: Run model validation gate
        run: |
          python -m src.evaluation.model_validator --threshold 0.95 --per-class 0.85

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: outputs/reports/validation_report.json

  # ── Job 3: Build & push Docker image (main only, after validation) ──────────
  build-docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: validate-model
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push — configure registry creds to enable push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: bearing-fault-diagnosis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
